name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff

    - name: Lint
      # Rules and exclusions live in [tool.ruff] in pyproject.toml. Scoped to
      # pyflakes (F), so a failure here is a real defect, not a style opinion.
      run: ruff check .

    - name: Run Tests
      # The suite is pytest-based (bare `def test_*` functions), which
      # `unittest discover` cannot collect. Paths come from
      # [tool.pytest.ini_options] in pyproject.toml.
      run: python -m pytest -q
